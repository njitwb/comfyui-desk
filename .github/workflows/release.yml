name: Release

# 推 tag 触发发布（v1.2.3 → 版本号 1.2.3，产出 NSIS 安装包 + 绿色版 zip 并挂到 Release）
# 手动触发只构建、上传 workflow artifact，用于发布前验证
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号 x.y.z；留空则用 package.json 当前版本（手动触发不发布 Release）
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 产物文件名带版本号（artifactName: ${name}-${version}-${arch}.${ext}），
      # 所以必须让 package.json 版本与 tag 对齐
      - name: 对齐版本号
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          if (-not $v) {
            Write-Host '未指定版本号，沿用 package.json'
            exit 0
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "版本号格式错误: $v（应为 x.y.z）" }
          npm version $v --no-git-tag-version --allow-same-version
          Write-Host "版本号已设为 $v"

      - name: 类型检查与单测
        run: |
          npm run typecheck
          npm test

      # 内部依次执行：便携 Python / MinGit 准备 → typecheck → vite 构建 → electron-builder
      - name: 打包
        run: npm run release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-desk-win-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      # 只挂 exe 与 zip：应用内更新按 releases API 的 x64 exe 资产下载并校验 sha256，
      # 不需要 blockmap（不做差量下载）与 latest.yml
      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
